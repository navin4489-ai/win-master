# Render Blueprint — Win Master
# Single free Docker web service: ASP.NET Core API (serves the Angular SPA) with
# the Node/Baileys WhatsApp bridge co-hosted in the same container, plus managed
# PostgreSQL. The API reaches the bridge over localhost (set in the Dockerfile).
#
# Note (free tier): the service sleeps after inactivity and has no persistent
# disk, so WhatsApp sessions reset on sleep/redeploy and must be re-scanned.
services:
  - type: web
    name: win-master
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: Database__Provider
        value: Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: win-master-db
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: License__SigningSecret
        generateValue: true
      # Shared secret between the API and the co-hosted bridge.
      - key: Bridge__Key
        generateValue: true
      # The co-hosted bridge listens on localhost:3001 (see Dockerfile).
      - key: Bridge__BaseUrl
        value: http://localhost:3001
      - key: Meta__VerifyToken
        generateValue: true

databases:
  - name: win-master-db
    databaseName: winmaster
    plan: free
    postgresMajorVersion: "17"
