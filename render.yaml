# Render Blueprint — Win Master
# Free-tier deploy: one Docker web service (ASP.NET Core API serving the Angular SPA) + managed PostgreSQL.
#
# The Node/Baileys WhatsApp bridge (services/wa-bridge) is OPTIONAL and needs a paid
# plan + persistent disk, so it is left out of the free blueprint. To enable it, add the
# commented "win-master-bridge" service at the bottom and set Bridge__BaseUrl on the API.
# Until then the API runs fully and simulates WhatsApp sends when no bridge is reachable.
services:
  - type: web
    name: win-master
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: Database__Provider
        value: Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: win-master-db
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: License__SigningSecret
        generateValue: true
      - key: Bridge__Key
        generateValue: true
      - key: Meta__VerifyToken
        generateValue: true

databases:
  - name: win-master-db
    databaseName: winmaster
    plan: free
    postgresMajorVersion: "17"

