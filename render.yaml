# Render Blueprint — Win Master
# One Docker web service (ASP.NET Core API serving the Angular SPA) + managed PostgreSQL.
services:
  - type: web
    name: win-master
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: Database__Provider
        value: Postgres
      - key: DATABASE_URL
        fromDatabase:
          name: win-master-db
          property: connectionString
      - key: Jwt__Secret
        generateValue: true
      - key: License__SigningSecret
        generateValue: true
      - key: Bridge__Key
        generateValue: true
      - key: Meta__VerifyToken
        generateValue: true

databases:
  - name: win-master-db
    databaseName: winmaster
    plan: free
    postgresMajorVersion: "17"
