<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Win Master — WhatsApp Marketing & Automation</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#128C4A">
  <meta name="description" content="Win Master — WhatsApp bulk messaging, automation, mini-CRM and licensing platform.">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<style>
  .wm-preboot { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:radial-gradient(900px 500px at 10% 0%,#1b9c5a 0%,transparent 55%),linear-gradient(145deg,#0b1220,#0f7a40); color:#fff; font-family:Inter,'Segoe UI',sans-serif; }
  .wm-preboot-card { width:min(440px,calc(100% - 40px)); text-align:center; }
  .wm-preboot-logo { width:82px; height:82px; padding:16px; margin:0 auto 22px; background:#fff; border-radius:24px; box-shadow:0 18px 40px rgba(0,0,0,.24); animation:wmPop .8s cubic-bezier(.2,.8,.2,1); }
  .wm-preboot-logo img { width:100%; height:100%; }
  .wm-preboot-title { font-size:27px; font-weight:800; letter-spacing:-.7px; }
  .wm-preboot-title span { color:#bdf5d1; }
  .wm-preboot-message { margin-top:9px; color:rgba(255,255,255,.82); font-size:14px; }
  .wm-preboot-thought { min-height:42px; margin:28px auto 20px; color:rgba(255,255,255,.7); font-size:13px; line-height:1.55; }
  .wm-preboot-bar { height:4px; max-width:220px; margin:auto; overflow:hidden; border-radius:9px; background:rgba(255,255,255,.18); }
  .wm-preboot-bar span { display:block; width:35%; height:100%; border-radius:9px; background:#25d366; animation:wmLoad 1.4s ease-in-out infinite; }
  @keyframes wmPop { from { opacity:0; transform:scale(.82) translateY(12px) } to { opacity:1; transform:none } }
  @keyframes wmLoad { 0% { transform:translateX(-130%) } 50% { transform:translateX(160%) } 100% { transform:translateX(320%) } }
</style>
<body>
  <app-root>
    <div class="wm-preboot" aria-live="polite">
      <div class="wm-preboot-card">
        <div class="wm-preboot-logo"><img src="logo.svg" alt="Win Master"></div>
        <div class="wm-preboot-title">Win<span>Master</span></div>
        <div class="wm-preboot-message">Preparing your workspace securely…</div>
        <div class="wm-preboot-thought" id="wm-thought">Good conversations create great businesses.</div>
        <div class="wm-preboot-bar"><span></span></div>
      </div>
    </div>
  </app-root>
  <script>
    (function () {
      var thoughts = [
        'Good conversations create great businesses.',
        'Every meaningful reply is a new opportunity.',
        'Consistency turns follow-ups into relationships.',
        'The best campaigns feel personal, not automated.',
        'Listen first. Respond better. Grow faster.',
        'Small improvements in every conversation compound.',
        'Your next customer may be one helpful message away.',
        'Relevant messages build trust faster than louder messages.'
      ];
      var node = document.getElementById('wm-thought');
      var index = Math.floor(Math.random() * thoughts.length);
      if (node) node.textContent = thoughts[index];
      setInterval(function () {
        if (!node) return;
        index = (index + 1) % thoughts.length;
        node.style.opacity = '0';
        setTimeout(function () { node.textContent = thoughts[index]; node.style.opacity = '1'; }, 220);
      }, 3600);
    })();
  </script>
</body>
</html>
